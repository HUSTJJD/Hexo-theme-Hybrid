# ------------------------------------------------------
# hybrid | 个人主页 + Wiki 笔记 混合主题
#
# 设计原则：
#   1. 内容数据放 source/_data/*.yml，这里只管外观与导航
#   2. 三种页面模式由 front-matter 的 layout 决定
#        home -> 全宽个人主页（无侧边栏）
#        page -> 常规页（无侧边栏）
#        wiki -> 笔记区（带目录树侧边栏）
# ------------------------------------------------------

#------------------------------------------------------
# 版本（发版必改）
#------------------------------------------------------
# 本地缓存（localStorage）与静态资源（css/js）共用的版本号。
# 站点发布新版（结构调整 / 样式重构 / JS 逻辑变更）时把它 +1：
#   1. css / js 的 URL 会带上 ?v=<version>，浏览器重新拉取，不再吃旧文件缓存
#   2. 旧版本的本地缓存会被丢弃，深浅色与侧栏偏好自动迁移到新版本
version: '6'

#------------------------------------------------------
# 站点标识
#------------------------------------------------------
favicon:
  light: /favicon-white.ico
  dark: /favicon.ico

# 顶栏左侧显示的站点名，留空则用 config.title
brand:
  name: ''
  # 顶栏是否显示头像
  avatar: true

#------------------------------------------------------
# 导航菜单
# icon 使用 font-awesome 4.7 的类名（不含 fa- 前缀）
#------------------------------------------------------
# 个人主页形态：只留三个入口。
# 分类 / 标签是笔记区的检索维度，入口在 /notes/ 里，不占顶级导航；
# 关于与首页内容完全重复，不单列。
menu:
  首页:
    url: /
    icon: home
  笔记:
    url: /notes/
    icon: sitemap

# 顶栏右侧外链图标
# 注意：GitHub / 邮箱这类个人信息不要写在这里，主题是共用的。
# 站点自己的值放根目录 _config.hybrid.yml（Hexo 官方的 alternate theme config）。
social:
  github:
    enable: false
    url: ''
    icon: github
  email:
    enable: false
    url: ''
    icon: envelope
  rss:
    enable: false
    url: /atom.xml
    icon: rss
  bilibili:
    enable: false
    url: ''
    icon: television

#------------------------------------------------------
# 外观
#------------------------------------------------------
appearance:
  # 暗色模式：auto | light | dark
  # auto 会跟随系统偏好，并记住用户手动切换的结果
  color_scheme: dark
  # 背景纹理：none | grid | dots
  backdrop: grid
  # 顶栏随向下滚动隐藏；false = 常驻
  hide_header_on_scroll: false

#------------------------------------------------------
# 侧边栏（目录树）
#------------------------------------------------------
sidebar:
  # 节点显示文章标题还是文件名，false 用文件名
  usePostTitle: false
  # 桌面端默认展开侧边栏
  default_open: true
  # 指定目录的子节点顺序；未列出的节点继续按“目录优先 + 名称”排序
  order:
    'Base Knowledge':
      - Mathematics
      - Computer
      - Artificial Intelligence
    'Base Knowledge/Computer':
      - Computer Architecture
      - Operating System
      - Computer Network
      - Data Structures & Algorithm
      - Compilation Principle
      - Computer Graphics
  # 搜索框：tree 过滤目录树，google/baidu 跳转站外搜索
  search:
    mode: tree
    engine: https://www.google.com/search?q=

#------------------------------------------------------
# 分类主题分区
# ------------------------------------------------------
# 只需要登记「一级分类」：中文名、一句话描述、图标、配色。
# 二级分类（Unreal Engine/GamePlay 里的 GamePlay）由 _posts 的目录层级
# 自动推导，不需要手写，也不会和一级分类混在同一个列表里。
# 配色可选：violet | amber | blue | green | rose
#------------------------------------------------------
categories:
  - key: LLM
    name: LLM / 大模型
    desc: 大模型原理、训练与 Agent 工程化
    icon: brain
    color: violet
  - key: 'Unreal Engine'
    name: Unreal Engine
    desc: Gameplay、GAS、动画与网络同步
    icon: gamepad
    color: amber
  - key: Programing
    name: 编程
    desc: C/C++、Python 与工程实践
    icon: code
    color: blue
  - key: Base Knowledge
    name: 基础知识
    desc: 图形学、数学与计算机基础
    icon: book
    color: green
  - key: Work Experience
    name: 工作经验
    desc: 项目复盘与工程方法论
    icon: briefcase
    color: rose

#------------------------------------------------------
# 笔记入口 /notes/
#------------------------------------------------------
notes:
  # 首页「最近更新」取多少条
  recent_count: 6

#------------------------------------------------------
# 增强 Markdown：图表与公式
# 都交给成熟库渲染，主题只负责按需引入运行时与样式
#------------------------------------------------------
markdown:
  # Mermaid：把 ```mermaid 代码块渲染成流程图 / 时序图 / 类图等
  # 仅在页面里确实存在图表时，才从 CDN 懒加载 mermaid
  mermaid:
    enable: true
    version: '12'
    # default | neutral | forest | dark
    theme: default
    theme_dark: dark
  # KaTeX：$...$ 与 $$...$$
  # 公式由 @vscode/markdown-it-katex 在构建期渲染成 HTML，这里只补样式
  math:
    enable: true
    # 需与渲染时使用的 katex 版本一致，否则类名对不上
    version: '0.16.11'

#------------------------------------------------------
# 增强 Markdown：内嵌媒体
#------------------------------------------------------
plugins:
  # B 站视频：{% bilibili BV1xx411c7mD %} 或 {% bilibili av170001 p:2 %}
  bilibili:
    enable: true
    # 默认分 P，可在标签里用 p:2 覆盖
    page: 1
    # 是否默认开弹幕：true 开、false 关
    danmaku: false
    # 画面比例：16/9 或 4/3
    ratio: '16/9'
    # 是否默认高清
    high_quality: true

#------------------------------------------------------
# 代码块
# token 配色写在 css/markdown.css，跟随深浅色，不需要额外加载 CDN 主题文件
# 高亮引擎由站点 _config.yml 的 syntax_highlighter 决定（推荐 prismjs）
#------------------------------------------------------
code:
  copyBtn:
    enable: true

#------------------------------------------------------
# 文章版权
#------------------------------------------------------
post:
  copyright:
    enable: true
    # BY | BY-SA | BY-ND | BY-NC | BY-NC-SA | BY-NC-ND | ZERO
    license: 'BY'
    author:
      enable: true
    postDate:
      enable: false
      format: "LL"
    updateDate:
      enable: true
      format: "LL"

#------------------------------------------------------
# 页脚
#------------------------------------------------------
footer:
  since: 2024
  # 访问统计（Vercount）
  statistics:
    vercount:
      enable: true
      src: https://cn.vercount.one/js

#------------------------------------------------------
# 评论（giscus）https://giscus.app/
#------------------------------------------------------
comment:
  giscus:
    enable: false
    repo:
    repo_id:
    category:
    category_id:
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    emit_metadata: 0
    input_position: bottom
    theme: preferred_color_scheme

#------------------------------------------------------
# 统计
#------------------------------------------------------
analytics:
  baidu:
    enable: false
    hm: ''
  google:
    enable: false
    id: ''

#------------------------------------------------------
# 自定义 CSS / JS（相对站点根目录）
#------------------------------------------------------
custom:
  css:
    path:
  js:
    path:
